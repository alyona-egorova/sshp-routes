<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route board – Saddle Sisters of High Park</title>
<meta name="theme-color" content="#fffbeb">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SSHP routes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fffbeb;--green:#365314;--green75:rgba(54,83,20,.75);--green20:rgba(54,83,20,.2);--green60:rgba(54,83,20,.6);--leaf:#6c9d40;--pink:#fda4af}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--green);font-family:Roboto,Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(32px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
.bar{background:var(--cream);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.bar img{width:44px;height:44px;display:block}
.bar h1{font-size:18px;font-weight:700;line-height:1.2}
.bar h1 small{display:block;font-size:12px;font-weight:500;color:var(--green60)}
.bar a{margin-left:auto;font-weight:700;font-size:14px;color:var(--green);text-decoration:none}
.filters{position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 16px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.08)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#dist{grid-template-columns:repeat(3,1fr)}
#dir .f:last-child{grid-column:span 2}
.f{min-width:0;min-height:44px;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:700;font-size:15px;padding:0 4px;cursor:pointer;line-height:1;transition:background-color .2s,color .2s;text-align:center;white-space:nowrap;overflow:hidden}
.f[aria-pressed="true"]{background:var(--green75);color:var(--cream);border-color:transparent}
.f:active{background:var(--pink);color:var(--green)}
.f:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px 0;font-size:14px;color:var(--green60)}
.status button{background:none;border:0;color:var(--green);font:inherit;font-weight:700;cursor:pointer;padding:10px 0;border-bottom:2px solid var(--pink);line-height:1}
#clear{margin-left:auto;border-bottom-color:transparent;color:var(--green60);font-weight:500}
#clear[hidden]{display:none}
ol{list-style:none;padding:6px 16px 0}
.r{display:grid;grid-template-columns:84px 1fr auto;align-items:center;column-gap:10px;padding:12px 0;min-height:64px;border-bottom:1px solid var(--green20);color:inherit;text-decoration:none;transition:background-color .2s}
.r:active{background:var(--pink)}
.r:focus-visible{outline:2px solid var(--pink);outline-offset:-2px}
.km{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.km i{font-style:normal;font-size:12px;font-weight:500;color:var(--green60);margin-left:2px}
.mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:500;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.side{display:flex;align-items:center}
.el{font-size:13px;font-weight:400;color:var(--green60);white-space:nowrap;font-variant-numeric:tabular-nums}
.el b{color:var(--green);font-weight:700}
.dr{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--pink);color:var(--green);padding:3px 6px;line-height:1.3;text-align:center;max-width:72px}
.none{padding:40px 16px;text-align:center;color:var(--green60)}
.foot{padding:24px 16px 0;font-size:13px;color:var(--green60);text-align:center}
@media (min-width:700px){body{max-width:680px;margin:0 auto}}
</style>
</head>
<body>
<div class="bar">
  <img src="logo.png" alt="SSHP logo" width="44" height="44">
  <h1>Route board<small>Saddle Sisters of High Park</small></h1>
  <a href="https://saddlesisters.ca/">saddlesisters.ca</a>
</div>
<div class="filters">
  <div class="row" id="dir" role="group" aria-label="Direction from Toronto (City of Toronto = stays in the city)"></div>
  <div class="row" id="dist" role="group" aria-label="Distance"></div>
</div>
<div class="status"><span id="count"></span><button id="clear" type="button" hidden>Clear filters</button><button id="sort" type="button"></button></div>
<ol id="list"></ol>
<div class="none" id="none" hidden>Nothing matches. Tap a selected filter to clear it.</div>
<p class="foot"><span id="src">Showing the built-in copy of the route list</span><br>Direction is where the ride goes, not where it starts; City of Toronto routes stay within the city. Tap a route to open it in Strava.</p>
<script>
/* ---- DATA SOURCE ----------------------------------------------------------
   Option A (recommended): a Google Sheet.  In Google Sheets: File > Share >
   Publish to web > choose the sheet tab > "Comma-separated values (.csv)" >
   Publish, and paste the URL it gives you here.  The sheet needs these
   columns (any order, header names matter): Name, Strava Link, Distance,
   Elevation, Direction.  Direction values: N, NE, E, SE, S, SW, W, NW, Local.
   Option B: leave SHEET_CSV_URL empty and the page uses routes.js instead.
   If the sheet fails to load (offline, URL wrong), routes.js is the fallback. */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRmW9sbfWaYRUCYH4D-1pP2ojTQVFLNa2d9ILJ3qWRwySykcVmxLwoYHuKhjvqktp_cGQHoHT6MCHkt/pub?output=csv";
</script>
<script src="routes.js"></script>
<script>
const GROUP={W:"West",SW:"West",NW:"North-West",N:"North",NE:"North-East",E:"East",SE:"East",S:"South",Local:"Local"};
let R=window.ROUTES||[];
const DIRS=[["West","W"],["North-West","NW"],["North","N"],["North-East","NE"],["East","E"],["South","S"],["Local","Toronto"]];
const DISTS=[["<50","Under 50 km",r=>r.k<50],["50-100","50–100 km",r=>r.k>=50&&r.k<=100],[">100","Over 100 km",r=>r.k>100]];
const S={dir:new Set(),dist:new Set(),asc:true};
function build(id,items,key){const box=document.getElementById(id);for(const [val,label] of items){const b=document.createElement("button");b.type="button";b.className="f";b.textContent=label;b.setAttribute("aria-pressed","false");b.onclick=()=>{S[key].has(val)?S[key].delete(val):S[key].add(val);b.setAttribute("aria-pressed",S[key].has(val));draw();};box.appendChild(b);}}
build("dir",DIRS,"dir");build("dist",DISTS,"dist");
const sortBtn=document.getElementById("sort");sortBtn.onclick=()=>{S.asc=!S.asc;draw();};
const clearBtn=document.getElementById("clear");clearBtn.onclick=()=>{S.dir.clear();S.dist.clear();document.querySelectorAll(".f").forEach(b=>b.setAttribute("aria-pressed","false"));draw();};
(function(){const p=new URLSearchParams(location.hash.slice(1));
  for(const [key,id] of [["dir","dir"],["dist","dist"]]){const vals=(p.get(key)||"").split(",").filter(Boolean);const btns=[...document.getElementById(id).children];
    const items=key==="dir"?DIRS:DISTS;items.forEach(([val],i)=>{if(vals.includes(val)){S[key].add(val);btns[i].setAttribute("aria-pressed","true");}});}
  if(p.get("sort")==="desc")S.asc=false;})();
const short=Object.fromEntries(DIRS);
function draw(){
  const rows=R.filter(r=>(!S.dir.size||S.dir.has(r.d))&&(!S.dist.size||DISTS.some(d=>S.dist.has(d[0])&&d[2](r)))).sort((a,b)=>S.asc?a.k-b.k:b.k-a.k);
  document.getElementById("count").textContent=rows.length+" routes";
  clearBtn.hidden=!(S.dir.size||S.dist.size);
  const p=new URLSearchParams();if(S.dir.size)p.set("dir",[...S.dir].join(","));if(S.dist.size)p.set("dist",[...S.dist].join(","));if(!S.asc)p.set("sort","desc");
  history.replaceState(null,"",p.toString()?"#"+p.toString():location.pathname+location.search);
  sortBtn.textContent=S.asc?"Shortest first":"Longest first";
  const ol=document.getElementById("list");ol.innerHTML="";
  document.getElementById("none").hidden=rows.length>0;
  for(const r of rows){
    const li=document.createElement("li");
    li.innerHTML=`<a class="r" href="${r.u}" target="_blank" rel="noopener"><span class="km">${Number.isInteger(r.k)?r.k:r.k.toFixed(1)}<i>km</i></span><span class="mid"><span class="nm"></span><span class="el">Elevation gain <b>${r.e} m</b></span></span><span class="side"><span class="dr">${r.d==="Local"?"City of Toronto":short[r.d]}</span></span></a>`;
    li.querySelector(".nm").textContent=r.n;ol.appendChild(li);
  }
}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function fromSheet(rows){
  const hdr=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...k)=>hdr.findIndex(h=>k.some(x=>h.includes(x)));
  const iN=col("name"),iL=col("link","strava"),iD=col("dist"),iE=col("elev"),iR=col("direc");
  return rows.slice(1).map(r=>({n:(r[iN]||"").trim(),u:(r[iL]||"").trim(),k:parseFloat(r[iD]),e:Math.round(parseFloat(r[iE])),d:GROUP[(r[iR]||"").trim()]||(r[iR]||"").trim()}))
    .filter(r=>/strava\.com\/routes\/\d+/.test(r.u)&&!isNaN(r.k)&&!isNaN(r.e));
}
draw();
if(SHEET_CSV_URL){
  fetch(SHEET_CSV_URL,{cache:"no-store"}).then(x=>{if(!x.ok)throw new Error(x.status);return x.text();})
    .then(t=>{const rows=fromSheet(parseCSV(t));if(rows.length){R=rows;draw();document.getElementById("src").textContent="Live from the route sheet";}})
    .catch(e=>console.warn("Sheet not loaded, using routes.js:",e));
}
</script>
</body>
</html>
